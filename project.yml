name: CitiRoute
options:
  bundleIdPrefix: de.citiroute
  deploymentTarget: { iOS: "16.0" }
targets:
  CitiRoute:
    type: application
    platform: iOS
    sources: [CitiRoute]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.citiroute.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CitiRoute
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "CitiRoute liest mit der Kamera die Adressen auf der Post."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "CitiRoute nutzt deinen Standort als Startpunkt der Route."
